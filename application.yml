# 应用配置
server:
  port: 8080
  servlet:
    context-path: /api

# Spring配置
spring:
  profiles:
    active: dev
  application:
    name: volunteer-service-backend
  
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB
      location: ${java.io.tmpdir}
      resolve-lazily: false
  
  # 静态资源访问配置
  web:
    resources:
      static-locations: classpath:/static/,file:uploads/
      add-mappings: true
      cache:
        cachecontrol:
          max-age: 3600
  
  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/volunteer_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: VolunteerHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  # MyBatis Plus配置
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=30m

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*Mapper.xml

# JWT配置
jwt:
  secret: volunteer-service-platform-2025-jwt-secret-key-for-hs512-algorithm-must-be-at-least-512-bits-long-for-security-compliance-with-rfc7518-specification-abcdefghijklmnopqrstuvwxyz123456789
  expiration: 86400000  # 24小时，单位毫秒
  header: Authorization
  prefix: Bearer

# 文件上传配置
file:
  upload:
    path: uploads
    url-prefix: /uploads
    base-url: http://localhost:8080/api/uploads  # 完整的访问URL
    max-size: 10485760  # 10MB

# 日志配置
logging:
  level:
    com.volunteer: debug
    org.springframework.security: debug
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: logs/volunteer-service.log
